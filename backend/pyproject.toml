[project]
name = "mc-servant-backend"
version = "0.1.0"
description = "MC_Servant backend runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "websockets>=12.0",
    "javascript>=1.1.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "google-genai>=1.66.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.11",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
